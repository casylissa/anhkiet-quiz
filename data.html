header.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header.top h1{font-size:16px;margin:0 8px 0 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sp{flex:1}
.stat{font-size:13px;color:var(--mute)}
.stat.dirty{color:var(--warn);font-weight:600}
button.pri{background:var(--acc);color:var(--acc-ink);border:0;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.muted{color:var(--mute);font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
textarea{width:100%;resize:vertical}
input[type=number]{width:80px}
details.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.card>summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--mute)}
details.card[open]>summary::before{content:"▾"}
.num{font-weight:700;white-space:nowrap}
.sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;color:var(--mute);white-space:nowrap}
.badge.warn{color:var(--warn)}
.body{padding:4px 14px 14px;border-top:1px solid var(--line)}
.fields{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:10px 0}
.fields label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.fields label.grow{flex:1;min-width:240px}
.ans{border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0;background:var(--bg)}
.ahead{display:flex;gap:8px;align-items:flex-start}
.ahead .idx{width:20px;color:var(--mute);padding-top:6px;text-align:right}
.btns{display:flex;gap:4px}
.btns button,.x{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;padding:3px 8px;font:inherit}
.axes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;margin:8px 0 4px 28px}
@media(max-width:640px){.axes{grid-template-columns:repeat(2,1fr);margin-left:0}}
.axc{display:flex;flex-direction:column;font-size:12px;color:var(--ink);align-items:stretch;gap:2px}
.axc select{padding:3px 2px}
.axc select.on{background:var(--on);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 28px;align-items:center}
@media(max-width:640px){.chips{margin-left:0}}
.chip{display:inline-flex;gap:2px;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 4px}
.chip select{border:0;background:transparent;padding:2px}
.x{padding:0 7px}
.add{border:1px dashed var(--mute);background:transparent;color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer;font:inherit;font-size:13px}
.legend{display:block;font-size:12px;color:var(--mute);margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.legend b{color:var(--ink)}
.vec{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:8px 10px;margin:6px 0}
.vec label{font-size:12px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.vec input{width:100%}
.phase{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:10px 0}
.grid2 label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.grid2 label small{font-size:11px}
.grid2 input[type=text],.grid2 input[type=number]{width:100%}
table.t{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0 16px}
table.t th,table.t td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.barv{display:inline-block;height:10px;background:var(--acc);border-radius:5px;vertical-align:middle}
h2{font-size:16px;margin:20px 0 6px}
.issue{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:6px 10px;margin:4px 0;font-size:13px}
.ok{color:var(--acc)}
.axrow{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;margin:4px 0;align-items:center}
.axrow input{width:100%}
</style>
</head>

function quizCalibrate(D0, opts) {
  opts = opts || {};
  var N = opts.N || 3000, AX = ["A", "B", "C", "D", "E", "F", "G", "H"];
  var D = JSON.parse(JSON.stringify(D0, function (k, v) { return k.charAt(0) === "_" ? undefined : v; }));
  var seed = 20261126;
  function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

  var Q = D.questions, C = D.characters;
  var M = Q.map(function (q) { var m = {}; AX.forEach(function (a) { m[a] = q.ans.some(function (x) { return x.s && x.s[a]; }); }); return m; });
  var mass = {};
  C.forEach(function (c) { mass[c.id] = 0; });
  Q.forEach(function (q) { C.forEach(function (c) { var mx = 0; q.ans.forEach(function (a) { mx = Math.max(mx, (a.g && a.g[c.id]) || 0); }); mass[c.id] += mx; }); });
  function sigBonus(id, raw) {
    if (D.sigMode === "norm") { var m = Math.max(mass[id] || 0, D.sigFloor || 8); return D.sigCap * Math.min(1, raw / m); }
    return Math.min(D.sigCap, raw * D.sigUnit);
  }
  function sim(x, c, w) { var s = 0, m = 0, i; for (i = 0; i < 8; i++) { s += w[i] * (x[i] - c[i]) * (x[i] - c[i]); m += w[i] * 16; } return 100 * (1 - Math.sqrt(s) / Math.sqrt(m)); }

  var plays = [], p, nC = C.length;
  for (p = 0; p < N; p++) {
    var num = {}, den = {}, sig = {};
    AX.forEach(function (a) { num[a] = 0; den[a] = 0; });
    Q.forEach(function (q, qi) {
      if (!q.ans.length) return;
      var k = q.multi > 1 ? 1 + Math.floor(rnd() * Math.min(q.multi, q.ans.length)) : 1;
      var picks = shuffled(q.ans.length).slice(0, k), d = {};
      picks.forEach(function (i) {
        var a = q.ans[i], z;
        for (z in (a.s || {})) d[z] = (d[z] || 0) + a.s[z] / k;
        for (z in (a.g || {})) sig[z] = (sig[z] || 0) + a.g[z] / k;
      });
      AX.forEach(function (a) { if (!M[qi][a]) return; num[a] += (d[a] || 0) * q.w; den[a] += q.w; });
    });
    var V = AX.map(function (a) { return den[a] > 0 ? clamp(3 + D.gain * num[a] / den[a], 1, 5) : 3; });
    var flat = Math.max.apply(null, V.map(function (v) { return Math.abs(v - 3); })) < D.flatRange;
    var base = C.map(function (ch) {
      var best = -1e9;
      ch.phases.forEach(function (ph) { best = Math.max(best, sim(V, ph.v, ch.w)); });
      return best + sigBonus(ch.id, sig[ch.id] || 0);
    });
    plays.push({ base: base, flat: flat });
  }

  var bias = C.map(function () { return 0; }), it, ITER = 300;
  for (it = 0; it < ITER; it++) {
    var cnt = C.map(function () { return 0; }), tot = 0;
    plays.forEach(function (pl) {
      if (pl.flat) return;
      var bi = 0, bv = -1e9;
      pl.base.forEach(function (b, i) { var v = b + bias[i]; if (v > bv) { bv = v; bi = i; } });
      cnt[bi]++; tot++;
    });
    var lr = 80 - 65 * it / ITER;
    bias = bias.map(function (b, i) { return b + lr * (1 / nC - cnt[i] / Math.max(1, tot)); });
  }
  var mxb = Math.max.apply(null, bias);
  bias = bias.map(function (b) { return b - mxb; });
  var adj = D.biasAdjust || {};
  bias = bias.map(function (b, i) { return b + (+adj[C[i].id] || 0); });

  var tops = [], flatN = 0;
  plays.forEach(function (pl) {
    if (pl.flat) { flatN++; return; }
    tops.push(clamp(Math.max.apply(null, pl.base.map(function (b, i) { return b + bias[i]; })), 0, 100));
  });
  tops.sort(function (a, b) { return a - b; });

  var kIdx = Math.max(0, Math.min(tops.length - 1, Math.round(unkTarget * N) - flatN));

  C.forEach(function (c) { share[c.id] = 0; });
  plays.forEach(function (pl) {
    var sc = pl.base.map(function (b, i) { return { i: i, s: clamp(b + bias[i], 0, 100) }; }).sort(function (a, b) { return b.s - a.s; });

    text.oninput = function () { q.text = text.value; sum.textContent = q.text || "(chưa có nội dung)"; mark(); };

    setS.onchange = function () { q.set = +setS.value; upd(); mark(); };
    var wI = el("input", { type: "number", step: "0.1", min: "0", value: q.w });
    wI.oninput = function () { q.w = parseFloat(wI.value) || 0; mark(); };
    var mS = el("select", {}, [1, 2, 3, 4].map(function (v) { return el("option", { value: v, text: v === 1 ? "1 (chọn một)" : "Tối đa " + v, selected: (q.multi || 1) === v }); }));
    mS.onchange = function () { if (+mS.value > 1) q.multi = +mS.value; else delete q.multi; mark(); };
    var body = el("div", { class: "body" }, [
      el("div", { class: "fields" }, [
        el("label", { class: "grow" }, ["Câu hỏi", text]),
        el("label", {}, ["Phần", setS]), el("label", {}, ["Trọng số", wI]), el("label", {}, ["Cách chọn", mS])]),
      ansRows(q.ans, "main", function () { redraw(); }),
      el("div", { class: "fields" }, [
        btn("↑ Lên", "", function () { if (move(S.questions, qi, -1)) { mark(); render(); } }, "sec"),
        btn("↓ Xuống", "", function () { if (move(S.questions, qi, 1)) { mark(); render(); } }, "sec"),
        btn("Nhân bản", "", function () { var c = JSON.parse(JSON.stringify(q)); c._open = true; S.questions.splice(qi + 1, 0, c); mark(); render(); }, "sec"),
        btn("Xóa câu này", "", function () { if (confirm("Xóa cả câu hỏi này?")) { S.questions.splice(qi, 1); mark(); render(); } }, "sec")])]);
    d.appendChild(body);
    return d;
  }

  /* ---------- tiebreak ---------- */
  function viewT() {
    var w = el("div");
    w.appendChild(el("p", { class: "muted", text: "Câu phụ chỉ hiện khi top 1 và top 2 của người chơi sát nhau và đúng là cặp nhân vật được chọn ở đây. Câu phụ không có điểm trục, chỉ có điểm cho nhân vật. Đáp án để trống điểm là đáp án trung lập." }));
    var list = el("div");
    w.appendChild(el("div", { class: "bar" }, [el("span", { class: "muted", text: S.tiebreak.length + " câu phụ" }), el("span", { class: "sp" }),
      btn("+ Thêm câu phụ", "", function () {
        S.tiebreak.push({ id: "", pair: [S.characters[0].id, S.characters[1].id], text: "", ans: [{ t: "", s: {}, g: {} }, { t: "", s: {}, g: {} }], _open: true });
        mark(); render(); window.scrollTo(0, document.body.scrollHeight);
      }, "pri")]));
    w.appendChild(list);
    S.tiebreak.forEach(function (q, qi) {
      var d = el("details", { class: "card" }); d.open = !!q._open;
      d.addEventListener("toggle", function () { q._open = d.open; });
      var sum = el("span", { class: "sum", text: q.text || "(chưa có nội dung)" });
      var pairTxt = el("span", { class: "badge" });
      function upd() { pairTxt.textContent = cname(q.pair[0]) + " / " + cname(q.pair[1]); }
      upd();
      d.appendChild(el("summary", {}, [el("span", { class: "num", text: "Phụ " + (qi + 1) }), sum, pairTxt]));
      function pairSel(i) {
        var s = el("select", {}, S.characters.map(function (c) { return el("option", { value: c.id, text: c.name, selected: q.pair[i] === c.id }); }));
        s.onchange = function () { q.pair[i] = s.value; upd(); mark(); }; return s;
      }
      var text = el("textarea", { rows: 2, value: q.text });
      text.oninput = function () { q.text = text.value; sum.textContent = q.text || "(chưa có nội dung)"; mark(); };
      d.appendChild(el("div", { class: "body" }, [
        el("div", { class: "fields" }, [el("label", {}, ["Cặp hay lẫn (1)", pairSel(0)]), el("label", {}, ["Cặp hay lẫn (2)", pairSel(1)]), el("label", { class: "grow" }, ["Câu hỏi", text])]),
        ansRows(q.ans, "tb", function () { render(); }),
        el("div", { class: "fields" }, [
          btn("↑ Lên", "", function () { if (move(S.tiebreak, qi, -1)) { mark(); render(); } }, "sec"),
          btn("↓ Xuống", "", function () { if (move(S.tiebreak, qi, 1)) { mark(); render(); } }, "sec"),
          btn("Xóa câu này", "", function () { if (confirm("Xóa câu phụ này?")) { S.tiebreak.splice(qi, 1); mark(); render(); } }, "sec")])]));
      list.appendChild(d);
    });
    return w;
  }

  /* ---------- characters ---------- */
  function viewC() {
    var w = el("div");
    w.appendChild(el("p", { class: "muted", text: "Vector A đến H của từng giai đoạn dùng thang 1 đến 5. Người chơi được so với mọi giai đoạn, giai đoạn nào gần nhất sẽ hiện ra. Trọng số trục: 1 là bình thường, 0 là bỏ qua trục đó khi so với nhân vật này, lớn hơn 1 là trục đó quan trọng hơn." }));
    S.characters.forEach(function (c) {
      var d = el("details", { class: "card" }); d.open = !!c._open;
      d.addEventListener("toggle", function () { c._open = d.open; });
      d.appendChild(el("summary", {}, [el("span", { class: "num", text: c.name }), el("span", { class: "sum", text: c.id }), el("span", { class: "badge", text: c.phases.length + " giai đoạn" })]));
      var name = el("input", { type: "text", value: c.name }); name.oninput = function () { c.name = name.value; mark(); };
      var wv = el("div", { class: "vec" }, AXK.map(function (k, i) {
        var inp = el("input", { type: "number", step: "0.5", min: "0", value: c.w[i] }); inp.oninput = function () { c.w[i] = parseFloat(inp.value) || 0; mark(); };
        return el("label", { title: axTip(k) }, [axLab(k), inp]);
      }));
      var body = el("div", { class: "body" }, [el("div", { class: "fields" }, [el("label", {}, ["Tên hiển thị", name])]), el("div", { class: "muted", text: "Trọng số trục" }), wv]);
      c.phases.forEach(function (p, pi) {
        var lab = el("input", { type: "text", value: p.label, placeholder: "Tên giai đoạn (để trống nếu chỉ có một)" }); lab.oninput = function () { p.label = lab.value; mark(); };
        var vec = el("div", { class: "vec" }, AXK.map(function (k, i) {
          var inp = el("input", { type: "number", step: "0.5", min: "1", max: "5", value: p.v[i] }); inp.oninput = function () { p.v[i] = parseFloat(inp.value) || 1; mark(); };
          return el("label", { title: axTip(k) }, [axLab(k), inp]);
        }));
        var desc = el("textarea", { rows: 3, value: p.desc, placeholder: "Mô tả hiện ở thẻ kết quả" }); desc.oninput = function () { p.desc = desc.value; mark(); };
        var ph = el("div", { class: "phase" }, [el("div", { class: "fields" }, [el("label", { class: "grow" }, ["Giai đoạn " + (pi + 1), lab]),
          c.phases.length > 1 ? btn("Xóa giai đoạn", "", function () { if (confirm("Xóa giai đoạn này?")) { c.phases.splice(pi, 1); mark(); render(); } }, "sec") : null]), vec, desc]);
        body.appendChild(ph);
      });
      body.appendChild(btn("+ Thêm giai đoạn", "", function () { c._open = true; c.phases.push({ label: "", v: [3, 3, 3, 3, 3, 3, 3, 3], desc: "" }); mark(); render(); }, "sec"));
      d.appendChild(body); w.appendChild(d);
    });
    return w;
  }

  /* ---------- settings ---------- */
  function viewS() {
    var w = el("div");
    function field(label, hint, key, type, parent, k2) {
      var o = parent || S, kk = k2 || key;
      var inp = el("input", { type: type, step: type === "number" ? "any" : null, value: o[kk] == null ? "" : o[kk] });
      inp.oninput = function () { o[kk] = type === "number" ? (parseFloat(inp.value) || 0) : inp.value; mark(); };
      return el("label", {}, [label, inp, el("small", { text: hint })]);
    }
    w.appendChild(el("h2", { text: "Chung" }));
    w.appendChild(el("div", { class: "grid2" }, [
      field("Tiêu đề quiz", "", "title", "text"), field("Dòng phụ dưới tiêu đề", "", "subtitle", "text"),
      field("Tên phần 1", "", "1", "text", S.setNames), field("Tên phần 2", "", "2", "text", S.setNames)]));
    w.appendChild(el("h2", { text: "Cách tính điểm" }));
    w.appendChild(el("div", { class: "grid2" }, [
      field("gain", "Độ khuếch đại điểm trục (chênh lệch giữa các đáp án)", "gain", "number"),
      field("flatRange", "Trả lời quá trung tính (mọi trục lệch dưới số này) thì ra trang “không giống ai”", "flatRange", "number"),
      field("sigCap", "Điểm signature tối đa một nhân vật nhận được", "sigCap", "number"),
      field("sigFloor", "Mốc sàn khi chuẩn hóa signature", "sigFloor", "number"),
      field("tbGap", "Câu phụ hiện khi top 1 và top 2 chênh dưới số điểm này. Tăng thì nhiều người gặp câu phụ hơn", "tbGap", "number"),
      field("tbUnit", "Điểm cộng cho mỗi đáp án câu phụ", "tbUnit", "number")]));
    w.appendChild(el("h2", { text: "Tên 8 trục" }));
    S.axes.forEach(function (a) {
      var lo = el("input", { type: "text", value: a.lo, placeholder: "Điểm thấp" }), hi = el("input", { type: "text", value: a.hi, placeholder: "Điểm cao" });
      lo.oninput = function () { a.lo = lo.value; mark(); }; hi.oninput = function () { a.hi = hi.value; mark(); };
      w.appendChild(el("div", { class: "axrow" }, [el("b", { text: a.k }), lo, hi]));
    });
    w.appendChild(el("h2", { text: "Hiệu chỉnh tự động" }));
    w.appendChild(el("p", { class: "muted", text: "Máy mô phỏng 3000 lượt chơi ngẫu nhiên để mỗi nhân vật có tỉ lệ trúng gần bằng nhau và “không giống ai” khoảng 8%. Bước này tự chạy mỗi lần bấm Lưu, nên bạn không cần tính tay. Bấm nút dưới đây nếu muốn xem thử kết quả trước khi lưu." }));
    var out = el("div");
    w.appendChild(btn("Tính thử hiệu chỉnh", "", function () {
      out.textContent = "Đang tính…";
      setTimeout(function () {
        try {
          var r = quizCalibrate(S); out.textContent = "";
          var rows = S.characters.map(function (c) {
            var p = r.stats.share[c.id] * 100;
            return el("tr", {}, [el("td", { text: c.name }), el("td", {}, [el("span", { class: "barv", style: "width:" + Math.round(p * 12) + "px" }), " " + p.toFixed(1) + "%"]), el("td", { text: String(r.calibration.bias[c.id]) })]);
          });
          out.appendChild(el("table", { class: "t" }, [el("tr", {}, [el("th", { text: "Nhân vật" }), el("th", { text: "Tỉ lệ ra kết quả" }), el("th", { text: "bias" })])].concat(rows)));
          out.appendChild(el("p", { text: "Không giống ai: " + (r.stats.unknown * 100).toFixed(1) + "% · Ngưỡng T: " + r.calibration.T + " · Người gặp câu phụ: " + (r.stats.tiebreak * 100).toFixed(1) + "%" }));
        } catch (e) { out.textContent = "Lỗi: " + e.message; }
      }, 30);
    }, "sec"));
    w.appendChild(out);
    return w;
  }

  /* ---------- stats & checks ---------- */
  function viewK() {
    var w = el("div"), issues = [];
    S.questions.forEach(function (q, qi) {
      var n = "Câu " + (qi + 1);
      if (!q.text.trim()) issues.push(n + ": chưa có nội dung câu hỏi.");
      if (q.ans.length < 2) issues.push(n + ": chỉ có " + q.ans.length + " đáp án.");
      if (q.multi && q.multi > q.ans.length) issues.push(n + ": cho chọn tối đa " + q.multi + " nhưng chỉ có " + q.ans.length + " đáp án.");
      q.ans.forEach(function (a, ai) {
        if (!a.t.trim()) issues.push(n + ", đáp án " + (ai + 1) + ": để trống chữ.");
        else if (noScore(a)) issues.push(n + ", đáp án " + (ai + 1) + " (“" + a.t.slice(0, 40) + "”): chưa có điểm trục hay điểm nhân vật nào. Nếu cố ý trung lập thì bỏ qua.");
      });
    });
    S.tiebreak.forEach(function (q, qi) {
      var n = "Phụ " + (qi + 1);
      if (q.pair[0] === q.pair[1]) issues.push(n + ": hai nhân vật trong cặp giống nhau.");
      if (!q.text.trim()) issues.push(n + ": chưa có nội dung.");
      if (q.ans.length < 2) issues.push(n + ": chỉ có " + q.ans.length + " đáp án.");
    });
    w.appendChild(el("h2", { text: "Kiểm tra" }));
    if (!issues.length) w.appendChild(el("p", { class: "ok", text: "Không thấy vấn đề nào." }));
    issues.forEach(function (s) { w.appendChild(el("div", { class: "issue", text: s })); });

    var mass = {}, qn = {};
    S.characters.forEach(function (c) { mass[c.id] = 0; qn[c.id] = 0; });
    S.questions.forEach(function (q) {
      S.characters.forEach(function (c) {
        var mx = 0; q.ans.forEach(function (a) { mx = Math.max(mx, (a.g && a.g[c.id]) || 0); });
        mass[c.id] += mx; if (mx) qn[c.id]++;
      });
    });
    var maxMass = Math.max.apply(null, S.characters.map(function (c) { return mass[c.id]; })) || 1;
    w.appendChild(el("h2", { text: "Điểm signature theo nhân vật" }));
    w.appendChild(el("p", { class: "muted", text: "Tổng điểm cao nhất mỗi nhân vật có thể nhận ở các câu chính, và số câu có đáp án cho nhân vật đó. Chênh lệch lớn thì nhân vật ít điểm khó ra kết quả (hiệu chỉnh tự động bù được một phần)." }));
    w.appendChild(el("table", { class: "t" }, [el("tr", {}, [el("th", { text: "Nhân vật" }), el("th", { text: "Tổng điểm" }), el("th", { text: "Số câu" })])].concat(
      S.characters.map(function (c) { return el("tr", {}, [el("td", { text: c.name }), el("td", {}, [el("span", { class: "barv", style: "width:" + Math.round(mass[c.id] / maxMass * 160) + "px" }), " " + mass[c.id]]), el("td", { text: String(qn[c.id]) })]); }))));

    var ac = {};
    AXK.forEach(function (k) { ac[k] = 0; });
    S.questions.forEach(function (q) { AXK.forEach(function (k) { if (q.ans.some(function (a) { return a.s && a.s[k]; })) ac[k]++; }); });
    w.appendChild(el("h2", { text: "Số câu ảnh hưởng đến mỗi trục" }));
    w.appendChild(el("table", { class: "t" }, [el("tr", {}, [el("th", { text: "Trục" }), el("th", { text: "Số câu" })])].concat(
      AXK.map(function (k) { return el("tr", {}, [el("td", { text: axTip(k) }), el("td", {}, [el("span", { class: "barv", style: "width:" + ac[k] * 8 + "px" }), " " + ac[k]])]); }))));
    return w;
  }

  /* ---------- save / open ---------- */
  function dataJSON() {
    return JSON.stringify(S, function (k, v) { return k.charAt(0) === "_" ? undefined : v; }, 1)
      .replace(/\[\s+([-\d.,\s]+?)\s+\]/g, function (m, a) { return "[" + a.replace(/\s+/g, "") + "]"; })
      .replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
  }
  function save() {
    try { S.calibration = quizCalibrate(S).calibration; }
    catch (e) { alert("Không tính được hiệu chỉnh (" + e.message + "). Dữ liệu vẫn được lưu."); }
    S.questions.forEach(function (q, i) { q.id = i + 1; });
    S.tiebreak.forEach(function (q, i) { q.id = "t" + (i + 1); });
    var json = dataJSON();
    var html = SRC.replace(DATA_RE, function (m, a, b, c) { return a + "\n" + json + "\n" + c; });
    var u = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    var a = el("a", { href: u, download: "data.html" }); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 3000);
    dirty = false; stat();
  }
  document.getElementById("savebtn").onclick = save;
  var fin = document.getElementById("openin");
  document.getElementById("openbtn").onclick = function () { fin.click(); };
  fin.onchange = function () {
    var f = fin.files[0]; if (!f) return;
    if (dirty && !confirm("Có thay đổi chưa lưu. Mở file khác sẽ mất chúng. Tiếp tục?")) { fin.value = ""; return; }
    var r = new FileReader();
    r.onload = function () {
      try {
        var t = String(r.result), data;
        var m = DATA_RE.exec(t);
        data = JSON.parse(m ? m[2] : t);
        if (!data.questions || !data.characters) throw new Error("không phải file dữ liệu quiz");
        S = normalize(data); dirty = false; stat(); render();
      } catch (e) { alert("Không đọc được file: " + e.message); }
      fin.value = "";
    };
    r.readAsText(f);
  };
  window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
  render();
})();
</script></body></html>
