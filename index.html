<script>(function (root) {
var AX = ["A", "B", "C", "D", "E", "F", "G", "H"];

function measures(D) {
  return D.questions.map(function (q) {
    var m = {};
    AX.forEach(function (a) {
      m[a] = q.ans.some(function (x) { return x.s && x.s[a]; });
    });
    return m;
  });
}

function pickDelta(q, picks) {
  var d = {}, sig = {};
  if (!picks || !picks.length) return { d: d, sig: sig };
  picks.forEach(function (i) {
    var a = q.ans[i];
    var k;
    for (k in (a.s || {})) d[k] = (d[k] || 0) + a.s[k] / picks.length;
    for (k in (a.g || {})) sig[k] = (sig[k] || 0) + a.g[k] / picks.length;
  });
  return { d: d, sig: sig };
}

function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

function vectors(D, answers) {
  var M = D._m || (D._m = measures(D));
  var sets = { all: null, 1: 1, 2: 2 };
  var num = { all: {}, 1: {}, 2: {} }, den = { all: {}, 1: {}, 2: {} };
  var sig = {};
  AX.forEach(function (a) { ["all", 1, 2].forEach(function (s) { num[s][a] = 0; den[s][a] = 0; }); });
  D.questions.forEach(function (q, qi) {
    var r = pickDelta(q, answers[qi]);
    var k;
    for (k in r.sig) sig[k] = (sig[k] || 0) + r.sig[k];
    AX.forEach(function (a) {
      if (!M[qi][a]) return;
      var v = (r.d[a] || 0) * q.w;
      num.all[a] += v; den.all[a] += q.w;
      num[q.set][a] += v; den[q.set][a] += q.w;
    });
  });
  function build(s, fallback) {
    return AX.map(function (a, i) {
      if (den[s][a] > 0) return clamp(3 + D.gain * num[s][a] / den[s][a], 1, 5);
      return fallback ? fallback[i] : 3;
    });
  }
  var all = build("all", null);
  return { all: all, s1: build(1, all), s2: build(2, all), sig: sig };
}

function sim(x, c, w) {
  var s = 0, m = 0, i;
  for (i = 0; i < 8; i++) { s += w[i] * (x[i] - c[i]) * (x[i] - c[i]); m += w[i] * 16; }
  return 100 * (1 - Math.sqrt(s) / Math.sqrt(m));
}

function sigMass(D) {
  if (D._mass) return D._mass;
  var m = {};
  D.characters.forEach(function (c) { m[c.id] = 0; });
  D.questions.forEach(function (q) {
    D.characters.forEach(function (c) {
      var mx = 0;
      q.ans.forEach(function (a) { mx = Math.max(mx, (a.g && a.g[c.id]) || 0); });
      m[c.id] += mx;
    });
  });
  return (D._mass = m);
}

function sigBonus(D, id, raw) {
  if (D.sigMode === "norm") {
    var mass = Math.max(sigMass(D)[id] || 0, D.sigFloor || 8);
    return D.sigCap * Math.min(1, raw / mass);
  }
  return Math.min(D.sigCap, raw * D.sigUnit);
}

function rank(D, V, calib) {
  var cal = calib || D.calibration;
  var out = D.characters.map(function (ch) {
    var best = null;
    ch.phases.forEach(function (p, pi) {
      var s = sim(V.all, p.v, ch.w);
      if (!best || s > best.s) best = { s: s, pi: pi };
    });
    var sg = sigBonus(D, ch.id, V.sig[ch.id] || 0);
    var f = clamp(best.s + ((cal.bias || {})[ch.id] || 0) + sg, 0, 100);
    return { id: ch.id, name: ch.name, pi: best.pi, raw: best.s, score: f };
  }).sort(function (a, b) { return b.score - a.score; });
  var flat = Math.max.apply(null, V.all.map(function (v) { return Math.abs(v - 3); })) < D.flatRange;
  return { ranked: out, unknown: out[0].score < cal.T || flat, flat: flat };
}

function bestFor(D, x, which) {
  var best = null;
  D.characters.forEach(function (ch) {
    var p = which === "first" ? ch.phases[0] : ch.phases[ch.phases.length - 1];
    var s = sim(x, p.v, ch.w);
    if (!best || s > best.s) best = { s: s, ch: ch };
  });
  return best.ch;
}

function evaluate(D, answers, calib) {
  var V = vectors(D, answers);
  var R = rank(D, V, calib);
  R.V = V;
  R.daily = bestFor(D, V.s1, "first");
  R.pressure = bestFor(D, V.s2, "last");
  return R;
}


function tbKey(a, b) { return [a, b].sort().join("|"); }
function tbNeeded(D, R) {
  if (!D.tiebreak || R.unknown || R.ranked.length < 2) return [];
  var r0 = R.ranked[0], r1 = R.ranked[1];

  qs.forEach(function (q, i) {

  out.ranked = ranked; out.tb = true;
  return out;
}
var E = { tbKey: tbKey, tbNeeded: tbNeeded, tbApply: tbApply, sigMass: sigMass, AX: AX, vectors: vectors, sim: sim, rank: rank, evaluate: evaluate, measures: measures };
if (typeof module !== "undefined" && module.exports) module.exports = E; else root.QUIZ_ENGINE = E;

  var INTRO_IMG = "";   // ảnh màn hình đầu, ví dụ "data:image/png;base64,..." hoặc URL
  // Ảnh thẻ: chuỗi (data URI hoặc URL). Riêng kevin và kosma có 2 ảnh theo thứ tự [lúc ban đầu, sau biến cố].
  // Ví dụ: { elysia: "data:image/png;base64,...", kevin: ["ảnh ban đầu", "ảnh sau biến cố"], kosma: ["ảnh ban đầu", "ảnh sau biến cố"] }
  var CHAR_IMG = { kevin: ["", ""], kosma: ["", ""] };
  var CHAR_STICKER = {}; // sticker làm ava dưới thẻ
  var CHAR_SAY = {};     // lời nhận xét trong ô thoại
  // ===================================================================================================================================
  var app = document.getElementById("app");
  var order = [], answers = [], cur = 0, multiSel = [], lastFocus = null;

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function ch(id) { return D.characters.filter(function (c) { return c.id === id; })[0]; }
  function nameOf(id) { return id === "none" ? "Không giống ai" : ch(id).name; }
  function ini(id) { return id === "none" ? "?" : ch(id).name.charAt(0).toUpperCase(); }
  function top() { window.scrollTo({ top: 0 }); }

  function start() {
    order = shuffle(D.questions.map(function (_, i) { return i; }));
    answers = D.questions.map(function () { return []; });
    cur = 0; intro();
  }

  function intro() {
    var img = INTRO_IMG ? '<img src="' + esc(INTRO_IMG) + '" alt="">' : 'Hình ảnh';
    app.innerHTML = '<h1>13 con người, 13 ngã rẽ khác biệt.</h1>' +
      '<p class="quote">Khi đứng trước khả năng lựa chọn, nhất định đừng để bản thân hối hận</p>' +
      '<p>Cùng tìm hiểu xem bạn sẽ giống ai nhất trong 13 Anh Kiệt nhé! Câu hỏi sẽ được xáo trộn ngẫu nhiên, hãy xem kĩ câu hỏi và tất cả các đáp án~</p>' +
      '<div class="introimg">' + img + '</div>' +
      '<button class="primary" id="go">Bắt đầu</button>';
    document.getElementById("go").onclick = question;
  }

  function answered(i) { var v = answers[order[i]]; return !!(v && v.length); }
  function nextUnanswered(from) {
    for (var i = from + 1; i < order.length; i++) if (!answered(i)) return i;
    for (var j = 0; j <= from; j++) if (!answered(j)) return j;
    return -1;
  }
  function goto_(i) {
    if (multiSel.length) answers[order[cur]] = multiSel.slice();
    cur = i; question();
  }

  function question() {
    if (cur >= order.length) return result();
    var qi = order[cur], q = D.questions[qi], max = q.multi || 1;
    var done = 0, i;
    for (i = 0; i < order.length; i++) if (answered(i) && i !== cur) done++;
    var others = done === order.length - 1;
    var last = cur === order.length - 1 && others;
    multiSel = (answers[qi] || []).slice();
    var nav = order.map(function (_, i) {
      return '<button type="button" data-i="' + i + '" class="' + (answered(i) ? "done" : "") + (i === cur ? " now" : "") + '" aria-label="Câu ' + (i + 1) + (answered(i) ? ", đã chọn" : "") + '"' + (i === cur ? ' aria-current="step"' : '') + '><i></i></button>';
    }).join("");
    app.innerHTML = '<div class="qn" id="qn" role="group" aria-label="Danh sách câu hỏi">' + nav + '</div>' +
      '<p class="tag">Câu ' + (cur + 1) + ' trên ' + order.length + '</p>' +
      '<h2>' + esc(q.text) + '</h2>' + (q.multi ? '<p class="hint">Chọn tối đa ' + q.multi + ' đáp án.</p>' : '') + '<div id="opts"></div>' +
      '<button class="primary" id="next"' + (multiSel.length ? '' : ' disabled') + '>' + (last ? 'Xem kết quả' : 'Tiếp tục') + '</button>' +
      (cur > 0 ? '<button class="ghost back" id="back">Quay lại</button>' : '');
    top();
    var opts = document.getElementById("opts"), nx = document.getElementById("next"), btns = [];
    shuffle(q.ans.map(function (_, i) { return i; })).forEach(function (ai) {
      var b = document.createElement("button"), on = multiSel.indexOf(ai) > -1;
      b.textContent = q.ans[ai].t;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) b.classList.add("sel");
      b.onclick = function () {
        var k = multiSel.indexOf(ai);
        if (max === 1) {
          btns.forEach(function (x) { x.classList.remove("sel"); x.setAttribute("aria-pressed", "false"); });
          multiSel = [ai]; b.classList.add("sel"); b.setAttribute("aria-pressed", "true");
        } else if (k > -1) { multiSel.splice(k, 1); b.classList.remove("sel"); b.setAttribute("aria-pressed", "false"); }
        else if (multiSel.length < max) { multiSel.push(ai); b.classList.add("sel"); b.setAttribute("aria-pressed", "true"); }
        nx.disabled = !multiSel.length;
      };
      btns.push(b); opts.appendChild(b);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#qn button"), function (d) {
      d.onclick = function () { goto_(parseInt(d.getAttribute("data-i"), 10)); };
    });
    if (cur > 0) document.getElementById("back").onclick = function () { goto_(cur - 1); };
    nx.onclick = function () {
      answers[qi] = multiSel.slice();
      if (cur < order.length - 1) { cur++; question(); return; }
      var n = nextUnanswered(cur);
      if (n === -1) { cur = order.length; result(); } else { cur = n; question(); }
    };
  }

  // ---- popup thẻ bài ----
  function openCard(id, phaseIdx) {
    closeCard(true);
    var c = id === "none" ? null : ch(id), ph = c ? c.phases[phaseIdx || 0] : null;
    var img = CHAR_IMG[id], stk = CHAR_STICKER[id];
    if (Array.isArray(img)) img = img[phaseIdx || 0] || img[0] || "";
    var say = CHAR_SAY[id] || ("Lời nhận xét của " + (c ? c.name : "thẻ này") + " sẽ hiện ở đây.");
    var ov = document.createElement("div");
    ov.className = "ov"; ov.id = "ov"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Thẻ " + nameOf(id));
    ov.innerHTML = '<div class="pop" style="--h:' + HUE[id] + '">' +
      '<div class="tcard"><div class="art">' + (img ? '<img src="' + esc(img) + '" alt="' + esc(nameOf(id)) + '">' : '<span class="init">' + ini(id) + '</span>') + '</div>' +
      '<div class="plate"><div class="nm">' + esc(nameOf(id)) + '</div></div></div>' +
      '<div class="say"><div class="stk">' + (stk ? '<img src="' + esc(stk) + '" alt="">' : ini(id)) + '</div><div class="bub">' + esc(say) + '</div></div>' +
      '<button class="primary" id="cl">Đóng</button><button class="alt" id="rs">Không giống! Lại đi</button></div>';
    lastFocus = document.activeElement;
    document.body.appendChild(ov);
    ov.onclick = function (e) { if (e.target === ov) closeCard(); };
    document.getElementById("cl").onclick = function () { closeCard(); };
    document.getElementById("rs").onclick = function () { closeCard(true); start(); };
    document.getElementById("cl").focus();
  }
  function closeCard(quiet) {
    var ov = document.getElementById("ov");
    if (ov) ov.parentNode.removeChild(ov);
    if (!quiet && lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCard(); });

  function gallery() {
    var ids = D.characters.map(function (c) { return c.id; }).concat(["none"]);
    return '<p class="sec">Cả 14 thẻ kết quả</p><div class="grid">' + ids.map(function (id) {
      return '<button class="tile" data-id="' + id + '" style="--h:' + HUE[id] + '"><span class="dot">' + ini(id) + '</span>' + esc(nameOf(id)) + '</button>';
    }).join("") + '</div>';
  }

  function result() {
    var R = E.evaluate(D, answers);
    var qs = E.tbNeeded ? E.tbNeeded(D, R) : [];
    if (!qs.length) return showResult(R);
    tbAsk(R, qs, 0, []);
  }

  function tbAsk(R, qs, i, picks) {
    var q = qs[i], sel = null;
    app.innerHTML = '<p class="tag">Câu phụ ' + (i + 1) + ' trên ' + qs.length + '</p>' +
      (i === 0 ? '<p class="hint">Kết quả của bạn đang nằm sát giữa hai nhân vật. Thêm ' + (qs.length > 1 ? 'vài câu' : 'một câu') + ' để phân biệt.</p>' : '') +
      '<h2>' + esc(q.text) + '</h2><div id="opts"></div>' +
      '<button class="primary" id="tbnext" disabled>' + (i === qs.length - 1 ? 'Xem kết quả' : 'Tiếp tục') + '</button>' +
      '<button class="ghost back" id="tbback">Quay lại</button>';
    top();
    var opts = document.getElementById("opts"), nx = document.getElementById("tbnext"), btns = [];
    shuffle(q.ans.map(function (_, k) { return k; })).forEach(function (ai) {
      var b = document.createElement("button");
      b.textContent = q.ans[ai].t; b.setAttribute("aria-pressed", "false");
      b.onclick = function () {
        btns.forEach(function (x) { x.classList.remove("sel"); x.setAttribute("aria-pressed", "false"); });
        sel = ai; b.classList.add("sel"); b.setAttribute("aria-pressed", "true"); nx.disabled = false;
      };
      btns.push(b); opts.appendChild(b);
    });
    nx.onclick = function () {
      picks[i] = [sel];
      if (i < qs.length - 1) tbAsk(R, qs, i + 1, picks);
      else showResult(E.tbApply(D, R, qs, picks));
    };
    document.getElementById("tbback").onclick = function () {
      if (i > 0) tbAsk(R, qs, i - 1, picks);
      else { cur = order.length - 1; question(); }
    };
  }

  function showResult(R) {
    var t0 = R.ranked[0];
    var id = R.unknown ? "none" : t0.id, pi = R.unknown ? 0 : t0.pi, ph = R.unknown ? null : ch(id).phases[pi];
    var html = '<p class="tag">Kết quả của bạn</p>';
    if (R.unknown) {
      html += '<p class="h1s">Bạn không giống ai</p><p>Bạn không khớp trọn vẹn với nhân vật nào trong 13 người. Bạn là một phiên bản riêng, không lẫn vào đâu được.</p>' +
        '<p>Gần bạn nhất là <b>' + esc(R.ranked[0].name) + '</b> (' + Math.round(R.ranked[0].raw) + '%) và <b>' + esc(R.ranked[1].name) + '</b> (' + Math.round(R.ranked[1].raw) + '%).</p>';
    } else {
      html += '<p class="h1s">Bạn giống ' + esc(ch(id).name) + '</p>' +
        '<p class="pct" style="--h:' + HUE[id] + '">' + Math.round(t0.score) + '% giống</p><p>' + esc(ph.desc) + '</p><div class="note">' +
        R.ranked.slice(0, 4).map(function (r) {
          return '<div class="row"><span class="n">' + esc(r.name) + '</span><span class="t"><span class="f" style="width:' + Math.round(r.score) + '%"></span></span><span class="p">' + Math.round(r.score) + '%</span></div>';
        }).join("") + '</div>';
    }
    if (R.daily.id !== R.pressure.id) html += '<p class="note">Ngày thường bạn giống <b>' + esc(R.daily.name) + '</b>, nhưng khi bị dồn vào chân tường lại giống <b>' + esc(R.pressure.name) + '</b>.</p>';
    html += '<button class="primary" id="again2" style="margin-top:18px">Xem lại thẻ của bạn</button>' + gallery() +
      '<div style="margin-top:22px"><button class="ghost" id="again">Làm lại</button></div>';
    app.innerHTML = html; top();
    document.getElementById("again2").onclick = function () { openCard(id, pi); };
    document.getElementById("again").onclick = start;
    Array.prototype.forEach.call(app.querySelectorAll(".tile"), function (b) { b.onclick = function () { openCard(b.getAttribute("data-id"), 0); }; });
    openCard(id, pi);
  }

  // ===== Chọn tông màu =====
  var TONES = [{"k": "pinkpurple", "n": "Tím hồng", "c": "hsl(300 33% 62%)"}, {"k": "purple", "n": "Tím", "c": "#7c6cf0"}, {"k": "blue", "n": "Xanh dương", "c": "hsl(212 36% 58%)"}, {"k": "teal", "n": "Xanh ngọc", "c": "hsl(172 30% 44%)"}, {"k": "orange", "n": "Cam", "c": "hsl(24 48% 60%)"}, {"k": "rose", "n": "Hồng", "c": "hsl(342 40% 64%)"}];
  (function () {
    var root = document.documentElement, box = document.getElementById("tone"), cur = "pinkpurple";
    try { var sv = localStorage.getItem("quizTone"); if (sv && TONES.some(function (t) { return t.k === sv; })) cur = sv; } catch (e) {}
    function apply(k) {
      cur = k; root.setAttribute("data-tone", k);
      try { localStorage.setItem("quizTone", k); } catch (e) {}
      draw();
    }
    function draw() {
      var open = box.classList.contains("open");
      box.innerHTML = '<div class="sw" role="group" aria-label="Chọn theme">' + TONES.map(function (t) {
        return '<button type="button" data-k="' + t.k + '" class="' + (t.k === cur ? "on" : "") + '" style="background:' + t.c + '" title="' + t.n + '" aria-label="' + t.n + '" aria-pressed="' + (t.k === cur) + '"></button>';
      }).join("") + '</div><button type="button" class="tbtn" id="tbtn" aria-expanded="' + open + '"><i></i>Theme</button>';
      Array.prototype.forEach.call(box.querySelectorAll(".sw button"), function (b) { b.onclick = function () { apply(b.getAttribute("data-k")); }; });
      document.getElementById("tbtn").onclick = function () { box.classList.toggle("open"); draw(); };
    }
    root.setAttribute("data-tone", cur); draw();
  })();

  start();
};
</script>
<script>
(function () {
  var app = document.getElementById("app");
  function run(D) { window.QUIZ_DATA = D; window.QUIZ_MAIN(); }
  function parse(t) {
    var el = new DOMParser().parseFromString(t, "text/html").getElementById("quiz-data");
    if (!el) throw new Error("không thấy dữ liệu quiz trong file");
    var D = JSON.parse(el.textContent);
    if (!D.questions || !D.characters || !D.calibration) throw new Error("file dữ liệu thiếu phần cần thiết");
    return D;
  }
  function pick(msg) {
    app.innerHTML = '<h1>Chưa nạp được dữ liệu</h1><p>' + msg + '</p>' +
      '<p>Nếu mở quiz trực tiếp từ máy (file://), trình duyệt không cho tự đọc <b>data.html</b>. Bạn chọn file đó bằng tay ở dưới, hoặc đăng cả hai file lên cùng một thư mục trên web (ví dụ GitHub Pages) thì quiz sẽ tự nạp.</p>' +
      '<p><input type="file" id="datafile" accept=".html,text/html"></p>';
    document.getElementById("datafile").onchange = function () {
      var f = this.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { try { run(parse(String(r.result))); } catch (e) { pick("Không đọc được file: " + e.message + "."); } };
      r.readAsText(f);
    };
  }
  app.innerHTML = "<p>Đang tải dữ liệu…</p>";
  fetch("data.html", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (t) { run(parse(t)); })
    .catch(function (e) { pick("Lỗi: " + e.message + "."); });
})();
</script>
</body>
</html>
