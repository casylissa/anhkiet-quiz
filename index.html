    if (artImg && cand.length) artImg.onerror = function () {
      var nx = cand.shift();
      if (nx) { artImg.src = nx; return; }
      artImg.onerror = null; artImg.parentNode.innerHTML = '<span class="init">' + ini(id) + '</span>';
    };
    else if (artImg) artImg.onerror = function () { artImg.onerror = null; artImg.parentNode.innerHTML = '<span class="init">' + ini(id) + '</span>'; };
    // tự cắt viền trống (trong suốt / trắng) quanh ảnh thẻ để ảnh luôn phủ kín khung
    if (artImg) artImg.addEventListener("load", function () {
      if (artImg.dataset.trimmed) return;
      try {
        var w = artImg.naturalWidth, h = artImg.naturalHeight; if (!w || !h) return;
        var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        var cx = cv.getContext("2d"); cx.drawImage(artImg, 0, 0);
        var d = cx.getImageData(0, 0, w, h).data;
        function blank(i) { return d[i + 3] < 14 || (d[i] > 244 && d[i + 1] > 244 && d[i + 2] > 244); }
        function rowBlank(y) { for (var x = 0; x < w; x++) if (!blank((y * w + x) * 4)) return false; return true; }
        function colBlank(x) { for (var y = 0; y < h; y++) if (!blank((y * w + x) * 4)) return false; return true; }
        var t = 0, b = h - 1, l = 0, r = w - 1;
        while (t < b && rowBlank(t)) t++;
        while (b > t && rowBlank(b)) b--;
        while (l < r && colBlank(l)) l++;
        while (r > l && colBlank(r)) r--;
        var nw = r - l + 1, nh = b - t + 1;
        if ((nw === w && nh === h) || nw < w * 0.6 || nh < h * 0.6) return;
        var c2 = document.createElement("canvas"); c2.width = nw; c2.height = nh;
        c2.getContext("2d").drawImage(cv, l, t, nw, nh, 0, 0, nw, nh);
        artImg.dataset.trimmed = "1";
        artImg.src = c2.toDataURL("image/png");
      } catch (e) { /* ảnh khác nguồn (mở bằng file://) thì bỏ qua, vẫn dùng object-fit:cover */ }
    });
    lastFocus = document.activeElement;
    document.body.appendChild(ov);
    ov.onclick = function (e) { if (e.target === ov) closeCard(); };
    document.getElementById("cl").onclick = function () { closeCard(); };
    document.getElementById("rs").onclick = function () { closeCard(true); restart(); };
    document.getElementById("cl").focus();
  }
  function closeCard(quiet) {
    var ov = document.getElementById("ov");
    if (ov) ov.parentNode.removeChild(ov);
    if (!quiet && lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCard(); });

  function result() {
    var R = E.evaluate(D, answers);
    var qs = E.tbNeeded ? E.tbNeeded(D, R) : [];
    if (!qs.length) return showResult(R);
    tbAsk(R, qs, 0, []);
  }

  // Tính lại kết quả từ đáp án (và câu phụ) đã lưu
  function showSaved() {
    var R = E.evaluate(D, answers), qs = E.tbNeeded ? E.tbNeeded(D, R) : [];
    if (!qs.length) return showResult(R);
    if (done.tb && done.tb.length === qs.length) return showResult(E.tbApply(D, R, qs, done.tb), done.tb);
    done = null; tbAsk(R, qs, 0, []); // câu phụ đã thay đổi thì hỏi lại
  }

  function tbAsk(R, qs, i, picks) {
    var q = qs[i], sel = null;
    app.innerHTML = '<p class="tag">Câu phụ ' + (i + 1) + ' trên ' + qs.length + '</p>' +
      (i === 0 ? '<p class="hint">Kết quả của bạn đang nằm sát giữa hai nhân vật. Thêm ' + (qs.length > 1 ? 'vài câu' : 'một câu') + ' để phân biệt.</p>' : '') +
      '<h2>' + esc(q.text) + '</h2><div id="opts"></div>' +
      '<button class="primary" id="tbnext" disabled>' + (i === qs.length - 1 ? 'Xem kết quả' : 'Tiếp tục') + '</button>' +
      '<button class="ghost back" id="tbback">Quay lại</button>';
    drawStats(); top();
    var opts = document.getElementById("opts"), nx = document.getElementById("tbnext"), btns = [];
    shuffle(q.ans.map(function (_, k) { return k; })).forEach(function (ai) {
      var b = document.createElement("button");
      b.textContent = q.ans[ai].t; b.setAttribute("aria-pressed", "false");
      b.onclick = function () {
        btns.forEach(function (x) { x.classList.remove("sel"); x.setAttribute("aria-pressed", "false"); });
        sel = ai; b.classList.add("sel"); b.setAttribute("aria-pressed", "true"); nx.disabled = false;
      };
      btns.push(b); opts.appendChild(b);
    });
    nx.onclick = function () {
      picks[i] = [sel];
      if (i < qs.length - 1) tbAsk(R, qs, i + 1, picks);
      else showResult(E.tbApply(D, R, qs, picks), picks);
    };
    document.getElementById("tbback").onclick = function () {
      if (i > 0) tbAsk(R, qs, i - 1, picks);
      else { cur = order.length - 1; question(); }
    };
  }

  // ===== Bảng thống kê "người khác ra gì" — chỉ ĐỌC bộ đếm (get), không ghi gì nên không ảnh hưởng số đếm =====
  function openStats(mine) {
    var old = document.getElementById("sov"); if (old) old.remove();
    var ov = document.createElement("div");
    ov.className = "ov"; ov.id = "sov"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Thống kê kết quả");
    ov.innerHTML = '<div class="spanel"><h3>Mọi người ra kết quả gì?</h3><p class="sub">Thống kê từ những người đã làm quiz</p><div id="sbody" class="sload">Đang tải số liệu…</div><button class="primary" id="sclose">Đóng</button></div>';
    var prev = document.activeElement;
    function close() { document.removeEventListener("keydown", onKey); ov.remove(); if (prev && prev.focus) prev.focus(); }
    function onKey(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    ov.onclick = function (e) { if (e.target === ov) close(); };
    document.body.appendChild(ov);
    var body = ov.querySelector("#sbody"), btn = ov.querySelector("#sclose");
    btn.onclick = close; btn.focus();
    if ((CT.counter || {}).enabled === false) { body.textContent = "Thống kê đang tắt."; return; }
    var ids = D.characters.map(function (c) { return c.id; }).concat("none"), data = {}, left = ids.length;
    function render() {
      if (!document.body.contains(ov)) return;
      var rows = ids.map(function (id) {
        var d = data[id], net = d.kq == null ? null : Math.max(d.kq, tallyLoad().id === id ? 1 : 0);
        return { id: id, n: net };
      }).filter(function (r) { return r.n != null; });
      if (!rows.length) { body.textContent = "Không tải được số liệu, bạn thử lại sau nhé."; return; }
      rows.sort(function (a, b) { return b.n - a.n; });
      var total = rows.reduce(function (t, r) { return t + r.n; }, 0), max = rows[0].n || 1, f = function (n) { return n.toLocaleString("vi-VN"); };
      body.className = "";
      body.innerHTML = rows.map(function (r) {
        return '<div class="srow' + (r.id === mine ? ' mine' : '') + '"><span class="n">' + esc(nameOf(r.id)) + '</span><span class="t"><span class="f" style="width:' + Math.round(r.n / max * 100) + '%;background:hsl(' + hue(r.id) + ' 65% 58%)"></span></span><span class="c">' + f(r.n) + '</span><span class="p">' + (total ? Math.round(r.n / total * 100) : 0) + '%</span></div>';
      }).join("") + '<p class="tot">Tổng <b>' + f(total) + '</b> lượt ra kết quả (làm lại mà ra kết quả khác được tính thêm)</p>';
    }
    function done() { if (!--left) render(); }
    ids.forEach(function (id) {
      data[id] = { kq: null };
      counter("get", "kq-" + id, function (v) { data[id].kq = v; done(); }, done);
    });
  }

  function showResult(R, tbPicks) {
    var rec = done || { counted: false };
    rec.tb = tbPicks || null; done = rec;
    var t0 = R.ranked[0];
    var id = R.unknown ? "none" : t0.id, pi = R.unknown ? 0 : t0.pi;
    // Trị số "e": đã gặp ít nhất một lần và đang ra phase sau thì có xác suất đổi về phase ban đầu (tung một lần mỗi lượt làm, lưu lại)
    if (!R.unknown && pi > 0 && R.V && R.V.early && R.V.early[id]) {
      if (rec.er == null) rec.er = Math.random();
      var ec = D.earlyChanceBy && D.earlyChanceBy[id] != null ? +D.earlyChanceBy[id] : (D.earlyChance == null ? 0.3 : +D.earlyChance);
      if (rec.er < ec) pi = 0;
    }
    var ph = R.unknown ? null : ch(id).phases[pi];
    var html = '<p class="tag">Kết quả của bạn</p>';
    if (R.unknown) {
      html += '<p class="h1s">Bạn không giống ai</p><p>Bạn không khớp trọn vẹn với nhân vật nào trong 13 người. Bạn là một phiên bản riêng, không lẫn vào đâu được.</p>' +
        '<p>Gần bạn nhất là <b>' + esc(R.ranked[0].name) + '</b> (' + Math.round(R.ranked[0].raw) + '%) và <b>' + esc(R.ranked[1].name) + '</b> (' + Math.round(R.ranked[1].raw) + '%).</p>';
    } else {
      html += '<p class="h1s">Bạn giống ' + esc(ch(id).name) + '</p>' +
        '<p class="pct" style="--h:' + hue(id) + '">' + Math.round(t0.score) + '% giống</p><p>' + esc(ph.desc) + '</p><div class="note">' +
        R.ranked.slice(0, 4).map(function (r) {
          return '<div class="row"><span class="n">' + esc(r.name) + '</span><span class="t"><span class="f" style="width:' + Math.round(r.score) + '%"></span></span><span class="p">' + Math.round(r.score) + '%</span></div>';
        }).join("") + '</div>';
    }
    if (R.daily.id !== R.pressure.id) html += '<p class="note">Ngày thường bạn giống <b>' + esc(R.daily.name) + '</b>, nhưng khi bị dồn vào chân tường lại giống <b>' + esc(R.pressure.name) + '</b>.</p>';
    html += '<p class="cnt" id="cnt" hidden></p><button class="primary" id="again2" style="margin-top:18px">Xem lại thẻ của bạn</button>' +
      '<button class="ghost" id="others" style="margin-top:2px">Xem người khác ra kết quả gì</button>' +
      '<div style="margin-top:22px"><button class="ghost" id="again">Làm lại</button></div>';
    app.innerHTML = html; drawStats(); top();
    document.getElementById("again2").onclick = function () { openCard(id, pi); };
    document.getElementById("others").onclick = function () { openStats(id); };
    document.getElementById("again").onclick = restart;
    var cntEl = document.getElementById("cnt");
    function showCount(n) {
      if (!document.body.contains(cntEl)) return;
      cntEl.innerHTML = 'Đã có <b>' + n + '</b> lượt ra kết quả ' + (id === "none" ? 'không giống ai' : 'giống ' + esc(ch(id).name)) + ' (tính cả bạn).';
      cntEl.hidden = false;
    }
    // Bản trước đã đếm lượt này rồi (có trong bài lưu) thì ghi nhận lại, không đếm nữa
    var m = tallyLoad();
    if (rec.counted && !m.id && !LOCAL) { m.results = true; m.id = id; tallySave(); }
    rec.counted = true; save();
    tally(id, showCount);
    openCard(id, pi);
  }

  start();
  // mỗi lần mở trang tính một lượt xem
  counter("hit", "views", function (n) { setStat("views", n); });
  counter("get", "results", function (n) { setStat("results", n); });
};
</script>
<script>
(function () {
  var app = document.getElementById("app");
  function run(D, C) { window.QUIZ_DATA = D; window.QUIZ_CONTENT = C || {}; window.QUIZ_MAIN(); }
  function parse(t) {
    var el = new DOMParser().parseFromString(t, "text/html").getElementById("quiz-data");
    if (!el) throw new Error("không thấy dữ liệu quiz trong file");
    var D = JSON.parse(el.textContent);
    if (!D.questions || !D.characters || !D.calibration) throw new Error("file dữ liệu thiếu phần cần thiết");
    return D;
  }
  function pick(msg) {
    app.innerHTML = '<h1>Chưa nạp được dữ liệu</h1><p>' + msg + '</p>' +
      '<p>Nếu mở quiz trực tiếp từ máy (file://), trình duyệt không cho tự đọc <b>data.html</b> và <b>asset/content.json</b>. Bạn chọn hai file đó bằng tay ở dưới (giữ Ctrl hoặc Shift để chọn cả hai), hoặc đăng cả quiz lên web (ví dụ GitHub Pages) thì quiz sẽ tự nạp. Ảnh trong asset/ cũng chỉ hiện đúng khi chạy trên web hoặc mở từ đúng thư mục.</p>' +
      '<p><input type="file" id="datafile" multiple accept=".html,.json,text/html,application/json"></p>';
    document.getElementById("datafile").onchange = function () {
      var files = Array.prototype.slice.call(this.files);
      Promise.all(files.map(function (f) {
        return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok({ n: f.name, t: String(r.result) }); }; r.readAsText(f); });
      })).then(function (rs) {
        var d = rs.filter(function (x) { return !/\.json$/i.test(x.n); })[0], c = rs.filter(function (x) { return /\.json$/i.test(x.n); })[0], C = {};
        try {
          if (!d) throw new Error("chưa chọn data.html");
          if (c) C = JSON.parse(c.t);
          run(parse(d.t), C);
        } catch (e) { pick("Không đọc được file: " + e.message + "."); }
      });
    };
  }
  app.innerHTML = "<p>Đang tải dữ liệu…</p>";
  var pc = fetch("asset/content.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });
  fetch("data.html", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (t) { var D = parse(t); return pc.then(function (C) { run(D, C); }); })
    .catch(function (e) { pick("Lỗi: " + e.message + "."); });
})();
</script>
